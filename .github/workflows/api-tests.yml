name: API Tests

on:
  push:
    branches: [ main, master, cinema ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      - name: Wait for HTTP readiness
        shell: bash
        run: |
          for endpoint in http://localhost:8080/api/users http://localhost:8081/api/movies/health http://localhost:8082/api/events/health http://localhost:8000/health; do
            ready=false
            for attempt in {1..60}; do
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 "$endpoint") || status=000
              if [ "$status" = 200 ]; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "Readiness timed out: $endpoint"
              exit 1
            fi
          done

      - name: Run API tests
        env:
          TEST_FOLDER: ${{ inputs.test_folder }}
        shell: bash
        run: |
          docker build -t cinemaabyss-api-tests tests/postman
          mkdir -p tests/postman/reports
          args=(--environment docker)
          if [ -n "$TEST_FOLDER" ]; then
            args+=(--folder "$TEST_FOLDER")
          fi
          docker run --network=cinemaabyss-network -v "$PWD/tests/postman/reports:/app/reports" cinemaabyss-api-tests "${args[@]}"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: tests/postman/reports/
          if-no-files-found: warn

      - name: Diagnose failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: Stop runner services
        if: always()
        run: docker compose down
