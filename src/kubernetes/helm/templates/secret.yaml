apiVersion: v1
kind: Secret
metadata:
  name: cinemaabyss-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  # Base64 encoded values
  DB_PASSWORD: {{ .Values.database.password }}